<!DOCTYPE html>
<html lang="en">
<!--
The internal goes into the head tag
and with the tag style inside of it the selector and specifying the style
-->
<head>
  <meta charset="UTF-8">
  <title>Internal</title>
  <style>
    h1{
      color: red;
    }
  </style>
</head>

<body>
<h1>Style Me in Red!</h1>
</body>

</html>
